<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Escolha o modelo BYD</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050509;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: linear-gradient(black, rgb(104, 0, 104));
    }
    header {
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 0;
    }
    header img {
      max-height: 200px;
      height: auto;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      text-align: center;
    }
    h1 {
      margin: 16px 0 24px;
      font-size: 22px;
    }
    .models-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 800px;
      gap: 60px;
    }
    .model-card {
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #333;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .model-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
      border-color: #e50914;
    }
    .model-card img {
      width: 100%;
      display: block;
    }
    .model-label {
      padding: 10px 14px;
      text-align: left;
      font-size: 16px;
      font-weight: bold;
      background: #181818;
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      min-height: 20px;
    }
    footer {
      background: #000;
      padding: 8px 0 0;
      text-align: center;
    }
    footer img {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo BYD" />
  </header>

  <main>
    <h1>Escolha o modelo para ver o vídeo na tela</h1>

    <div class="models-container">
      <div class="model-card" onclick="selectModel('sealion-7')">
        <img src="sealion-7.png" alt="BYD Sealion 7" />
        <!-- <div class="model-label">BYD Sealion 7</div> -->
      </div>

      <div class="model-card" onclick="selectModel('atto-2')">
        <img src="atto-2.png" alt="BYD ATTO 2" />
        <!-- <div class="model-label">BYD ATTO 2</div> -->
      </div>

      <div class="model-card" onclick="selectModel('seal')">
        <img src="seal.png" alt="BYD Seal" />
        <!-- <div class="model-label">BYD Seal</div> -->
      </div>
    </div>

    <div id="status" class="status"></div>
  </main>

  <footer>
    <img src="footer.jpg" alt="Footer" />
  </footer>

  <script>
    async function selectModel(model) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Enviando sua escolha...';

      try {
        const resp = await fetch('/byd.json', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ modelo: model })
        });

        if (!resp.ok) {
          statusEl.textContent = 'Falha ao enviar seleção (HTTP ' + resp.status + ')';
          return;
        }

        const data = await resp.json();
        statusEl.textContent = 'Escolha registrada: ' + data.modelo + '. Veja o vídeo na tela.';
      } catch (e) {
        statusEl.textContent = 'Erro ao se comunicar com o servidor: ' + e.message;
      }
    }
  </script>
</body>
</html>
